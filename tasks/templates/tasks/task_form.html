{% extends 'tasks/base.html' %}

{% block title %}{{ title|default:"Edit Task" }}{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow-lg">
            <div class="card-header text-center">
                ✏ {{ title|default:"Edit Task" }}
            </div>
            <div class="card-body">
                <form method="POST">
                    {% csrf_token %}

                    <div class="mb-3">
                        <label>Task Title</label>
                        <input type="text" name="title" class="form-control" value="{{ task.title }}" required>
                    </div>

                    <div class="mb-3">
                        <label>Description</label>
                        <textarea name="description" class="form-control">{{ task.description }}</textarea>
                    </div>

                    <div class="mb-3">
                        <label>Category</label>
                        <select name="category" class="form-select">
                            <option {% if task.category == 'Study' %}selected{% endif %}>Study</option>
                            <option {% if task.category == 'Work' %}selected{% endif %}>Work</option>
                            <option {% if task.category == 'Personal' %}selected{% endif %}>Personal</option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label>Priority</label>
                        <select name="priority" class="form-select">
                            <option {% if task.priority == 'High' %}selected{% endif %}>High</option>
                            <option {% if task.priority == 'Medium' %}selected{% endif %}>Medium</option>
                            <option {% if task.priority == 'Low' %}selected{% endif %}>Low</option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label>Status</label>
                        <select name="status" class="form-select">
                            <option {% if task.status == 'Pending' %}selected{% endif %}>Pending</option>
                            <option {% if task.status == 'Done' %}selected{% endif %}>Done</option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label>Due Date</label>
                        <input type="date" name="due_date" class="form-control" value="{{ task.due_date|date:'Y-m-d' }}">
                    </div>

                    <div class="d-flex justify-content-between">
                        <a href="{% url 'dashboard' %}" class="btn btn-secondary">Back</a>
                        <button class="btn btn-primary">Save Task</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
