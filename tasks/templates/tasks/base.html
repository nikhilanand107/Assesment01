<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Schedulo{% endblock %}</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        :root {
            --ice-cold: #a0d2eb;
            --freeze-purple: #e5eaf5;
            --medium-purple: #d0bdf4;
            --purple-pain: #8458B3;
            --heavy-purple: #a28089;
        }

        body {
    min-height: 100vh;
    background: linear-gradient(135deg, 
        var(--ice-cold), 
        var(--freeze-purple), 
        var(--medium-purple)
    );
    background-size: 300% 300%;
    animation: gradientMove 10s ease infinite;
}

        .navbar {
            background-color: var(--purple-pain);
        }

        .navbar-brand, .nav-link {
            color: white !important;
        }

        .btn-primary {
            background-color: var(--purple-pain);
            border: none;
        }

        .btn-primary:hover {
            background-color: var(--heavy-purple);
        }

        .card {
            border-radius: 15px;
            background-color: white;
        }

        .card-header {
            background-color: var(--medium-purple);
            font-weight: bold;
        }
       .fab {
    position: fixed;
    bottom: 30px;
    right: 30px;
    width: 60px;
    height: 60px;
    background-color: var(--purple-pain);
    color: white;
    border-radius: 50%;
    text-align: center;
    font-size: 30px;
    line-height: 60px;
    text-decoration: none;
    box-shadow: 0 0 0 rgba(132, 88, 179, 0.7);
    animation: pulse 2s infinite;
    transition: 0.3s;
    z-index: 1000;
}

.fab:hover {
    background-color: var(--heavy-purple);
    transform: scale(1.1);
    color: white;
}

@keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(132, 88, 179, 0.6); }
    70% { box-shadow: 0 0 0 15px rgba(132, 88, 179, 0); }
    100% { box-shadow: 0 0 0 0 rgba(132, 88, 179, 0); }
}
@keyframes gradientMove {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
}
.container {
    background: rgba(255, 255, 255, 0.4);
    backdrop-filter: blur(8px);
    border-radius: 15px;
    padding: 20px;
}
.container.mt-4 {
    margin-top: 30px !important;
}
    </style>
</head>

<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg shadow-sm">
    <div class="container">

        <!-- Brand -->
        <a class="navbar-brand fw-bold" href="{% url 'dashboard' %}">
            Schedulo
        </a>

        <!-- Right Side -->
        <div class="d-flex align-items-center gap-2">

    {% if user.is_authenticated %}

        <!-- Dashboard -->
        <a href="{% url 'dashboard' %}" class="btn btn-light btn-sm">
            Dashboard
        </a>

        <!-- Add Task -->
        <a href="{% url 'add_task' %}" class="btn btn-light btn-sm">
            + Add Task
        </a>

        <!-- Logout -->
        <form method="POST" action="{% url 'logout' %}">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger btn-sm">
                Logout
            </button>
        </form>

    {% else %}

        <!-- Login -->
        <a href="{% url 'login' %}" class="btn btn-light btn-sm">
            Login
        </a>

        <!-- Register -->
        <a href="{% url 'register' %}" class="btn btn-primary btn-sm">
            Register
        </a>

    {% endif %}

</div>

    </div>
</nav>
{% if user.is_authenticated %}
<a href="{% url 'add_task' %}" class="fab">+</a>
{% endif %}

<div class="container mt-4">
    {% block content %}
    {% endblock %}
</div>

</body>
</html>
